name: Optiwatt
description: >-
  Optiwatt is a consumer-centric energy management platform that helps electric-vehicle
  drivers and homeowners lower their electricity bills by automatically scheduling EV
  charging and smart-thermostat use for off-peak, low-cost, and low-carbon hours. Its
  consumer app (getoptiwatt.com) connects to vehicles, chargers, and thermostats via
  direct OEM integrations such as the Tesla Fleet API and aggregators like Smartcar,
  while its utility platform (optiwatt.com) orchestrates these distributed energy
  resources as virtual power plants across demand-response and load-shaping programs for
  utility partners. Backed by GV. Optiwatt is primarily a consumer of third-party APIs
  rather than a public API producer; no public developer API or OpenAPI has been found.
